<script>
(async()=>{try{if(!('DecompressionStream' in window))throw new Error('DecompressionStream non supporté.');const bytes=Uint8Array.from(atob(window.__NLAB_PACKED||''),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();window.__NLAB_PACKED='';document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='Impossible de charger la preview : '+e.message;console.error(e)}})();
