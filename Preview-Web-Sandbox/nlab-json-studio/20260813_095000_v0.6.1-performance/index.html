<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nLab JSON Studio v0.6.1 performance</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f172a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#status{position:fixed;z-index:10;left:12px;bottom:12px;background:rgba(15,23,42,.92);color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
iframe{display:block;width:100%;height:100%;border:0;background:white}
</style>
</head>
<body>
<div id="status">Chargement du hotfix performance…</div>
<iframe id="studio" src="../20260813_050900_v0.5-debugged/index.html" title="nLab JSON Studio"></iframe>
<script>
const frame=document.getElementById('studio');
const status=document.getElementById('status');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    const renderers={
      raw:()=>w.renderRaw(),
      hierarchy:()=>{w.renderTree();w.renderContext();w.updateSplitLayout()},
      table:()=>{w.renderPathPicker();w.renderTable()},
      form:()=>w.renderForm(),
      overview:()=>w.renderOverview(),
      catalog:()=>w.renderCatalog(),
      dictionary:()=>w.renderDictionary(),
      joins:()=>w.renderJoins(),
      roadmap:()=>w.renderRoadmap(),
      gantt:()=>w.renderGantt(),
      tasks:()=>w.renderTasks(),
      agents:()=>w.renderAgents()
    };
    const activeViewId=()=>d.querySelector('.view.active')?.id||'raw';
    w.renderAll=()=>{const fn=renderers[activeViewId()];if(fn)fn()};
    const tabs=d.getElementById('tabs');
    tabs.onclick=e=>{
      const b=e.target.closest('button[data-view]');if(!b)return;
      d.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      d.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      d.getElementById(b.dataset.view).classList.add('active');
      requestAnimationFrame(()=>w.renderAll());
    };
    const ver=d.querySelector('.ver');if(ver)ver.textContent='POC v0.6.1-performance';
    status.textContent='Hotfix actif : rendu de la vue active uniquement';
    setTimeout(()=>status.remove(),3500);
  }catch(err){status.textContent='Hotfix non appliqué : '+err.message;status.style.background='#7f1d1d'}
});
</script>
</body>
</html>
