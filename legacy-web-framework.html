<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Web Framework — Reviews legacy</title><style>body{margin:0;background:#f4f7fb;color:#182230;font:14px/1.45 system-ui}.wrap{max-width:1200px;margin:auto;padding:24px}.head,.card{background:#fff;border:1px solid #d9e2ec;border-radius:16px;padding:16px;margin:12px 0}.switches,.actions{display:flex;gap:8px;flex-wrap:wrap}.review-switch,.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid #d9e2ec;border-radius:999px;padding:6px 9px;background:#fff}.grid{display:grid;gap:12px}.card-head{display:flex;gap:12px;align-items:center}.version-no{font-weight:900;background:#eef5ff;color:#2563eb;padding:10px;border-radius:10px}.card-title{flex:1}.meta,.summary{color:#667085}.points{margin-top:10px}.points-list{display:grid;gap:6px;margin-top:8px}.point{padding:7px;border:1px solid #e8edf3;border-radius:8px}.actions a{padding:8px 10px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none}.actions .secondary{background:#eef2f7;color:#344054}.progress-line{height:7px;background:#edf1f5;border-radius:999px;overflow:hidden}.progress-line span{display:block;height:100%;background:#2563eb}.validated,.reference{color:#16803d}.partial,.to_validate,.in_progress{color:#b76800}.issue,.regression,.rejected{color:#b42318}.historical,.auto,.unknown,.planned{color:#667085}.empty{padding:16px;border:1px dashed #98a2b3;border-radius:10px}</style></head><body><main class="wrap"><section class="head"><h1>Reviews Web Framework — vue legacy</h1><p>Cette page conserve l’ancien système de reviews générées automatiquement. Le portail principal est désormais nLab Webmaster Preview.</p><div class="switches"><!-- REVIEW_FILTERS --></div></section><section class="grid"><!-- REVIEWS --><div class="empty">Aucune review générée.</div></section></main><script>(()=>{const boxes=[...document.querySelectorAll('[data-toggle-review]')],cards=[...document.querySelectorAll('[data-review-card]')];const apply=()=>{const s=new Set(boxes.filter(b=>b.checked).map(b=>b.value));cards.forEach(c=>c.hidden=!s.has(c.dataset.reviewCard))};boxes.forEach(b=>b.addEventListener('change',apply));apply()})();</script></body></html>
