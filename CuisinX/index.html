<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>nLab CuisineX — MVP</title>
  <meta name="description" content="CuisineX — laboratoire personnel de recettes techniques, ingrédients, techniques et matériel.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">🍽️ CuisineX</div>
      <input id="search" class="search" type="search" placeholder="Rechercher dans CuisineX…" aria-label="Recherche">
      <span class="grow"></span>
      <select id="lang" class="btn" aria-label="Langue"><option value="fr">FR</option><option value="en">EN</option></select>
    </div>
    <nav class="nav" aria-label="Sections">
      <button data-tab="recipes" class="active">Recettes</button>
      <button data-tab="ingredients">Ingrédients</button>
      <button data-tab="techniques">Techniques & astuces</button>
      <button data-tab="equipment">Matériel</button>
    </nav>
  </div>
</header>
<main class="wrap"><div id="app"><div class="panel">Chargement…</div></div></main>
<script src="app.js" defer></script>
</body>
</html>
