name: Deploy Preview Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview repository
        uses: actions/checkout@v4

      - name: Checkout Web Framework history
        uses: actions/checkout@v4
        with:
          repository: nepheris/nLab-Web-Framework
          ref: New
          fetch-depth: 0
          path: framework-source

      - name: Build site and validate historical reviews
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site .review-build
          mkdir -p _site/reviews .review-build
          cp index.html _site/index.html
          cp legacy-web-framework.html _site/legacy-web-framework.html
          cp -a assets _site/assets
          cp -a Preview-Web-Sandbox _site/Preview-Web-Sandbox
          cp LIGHTHOUSE-BENCHMARK-PROCESS.md _site/LIGHTHOUSE-BENCHMARK-PROCESS.md
          touch _site/.nojekyll

          # Source de vérité = Preview-Web-Sandbox. Le snapshot runtime est
          # généré directement dans l'artefact Pages ; aucun appel REST GitHub
          # n'est requis pour construire la galerie dans un navigateur neuf.
          python3 scripts/generate_public_inventory.py Preview-Web-Sandbox _site/assets/runtime/public-inventory.js
          node --check _site/assets/runtime/public-inventory.js
          python3 -m json.tool _site/assets/runtime/public-inventory.json >/dev/null
          node scripts/smoke_test_public_runtime.mjs _site/assets/runtime/public-inventory.js
          node scripts/smoke_test_network_contract.mjs .
          node scripts/smoke_test_gantt_hierarchy.mjs \
            _site/Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/index.html \
            _site/Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/project-hierarchy.json

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          text=p.read_text(encoding='utf-8')
          needle='<script src="assets/preview-browser.js"></script>'
          replacement=(
              '<script src="assets/runtime/public-inventory.js"></script>\n'
              + needle + '\n'
              '<script src="assets/preview-v14.js"></script>\n'
              '<script src="assets/preview-v15.js"></script>\n'
              '<script src="assets/preview-v19.js"></script>\n'
              '<script src="assets/preview-sandbox-center.js"></script>\n'
              '<script src="assets/preview-v25.js"></script>'
          )
          if needle not in text:
              raise SystemExit('preview-browser script marker missing')
          p.write_text(text.replace(needle,replacement,1),encoding='utf-8')
          PY

          node --check assets/preview-browser.js
          node --check assets/preview-ui-fixes.js
          node --check assets/preview-resilience.js
          node --check assets/preview-v13.js
          node --check assets/preview-v14.js
          node --check assets/preview-v15.js
          node --check assets/preview-v16.js
          node --check assets/preview-v17.js
          node --check assets/preview-v171-hotfix.js
          node --check assets/preview-v19.js
          node --check assets/preview-sandbox-center.js
          node --check assets/preview-v25.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          for marker in ('i-lighthouse', 'lighthouseMobile', 'lighthouseDesktop', 'pagespeed.web.dev/analysis'):
              if marker not in html:
                  raise SystemExit(f'Lighthouse toolbar marker missing: {marker}')
          PY
          python3 -m json.tool assets/config/priority-registry.json >/dev/null
          python3 -m json.tool assets/config/private-data-auth.json >/dev/null
          test -f Preview-Web-Sandbox/cockpit-nlab/20260813_010956_V4/index.html
          test -f assets/nlab-wordmark.svg
          test -s assets/runtime/images/recettes-du-coeur.png

          # Invariants de démarrage : snapshot puis cœur, centres ciblés seulement.
          # Les décorateurs historiques restent archivés mais ne sont plus exécutés.
          python3 - <<'PY'
          from pathlib import Path
          html=Path('_site/index.html').read_text(encoding='utf-8')
          runtime='assets/runtime/public-inventory.js'
          browser='assets/preview-browser.js'
          github='assets/preview-v14.js'
          settings='assets/preview-v15.js'
          modes='assets/preview-v19.js'
          sandbox='assets/preview-sandbox-center.js'
          layout='assets/preview-v25.js'
          retired=('assets/preview-ui-fixes.js','assets/preview-resilience.js','assets/preview-v13.js','assets/preview-v16.js','assets/preview-v17.js','assets/preview-v171-hotfix.js')
          if not (html.index(runtime) < html.index(browser) < html.index(github) < html.index(settings) < html.index(modes) < html.index(sandbox) < html.index(layout)):
              raise SystemExit('minimal startup order is invalid')
          for script in retired:
              if script in html:
                  raise SystemExit(f'historical decorator executed at startup: {script}')
          meta=Path('_site/Preview-Web-Sandbox/recettes-du-coeur/project.json').read_text(encoding='utf-8')
          if 'https://recettesducoeur.github.io/assets/images/logos/favicon.png' in meta:
              raise SystemExit('external Recettes favicon still in critical path')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('reviews.json').read_text(encoding='utf-8'))
          reviews=registry.get('reviews', [])[:int(registry.get('keep_visible', 5))]
          lines=[]
          for item in reviews:
              lines.append('\t'.join([
                  str(item['slot']), str(item['review']), str(item['date']),
                  str(item['sha']), str(item.get('status','historical'))
              ]))
          Path('.review-build/reviews.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

          : > .review-build/validated.tsv
          : > .review-build/rejected.tsv

          while IFS=$'\t' read -r slot review date sha status; do
            echo "=== Review V${review} · ${sha} · ${status} ==="
            tmp=".review-build/tmp-${review}"
            dest="_site/reviews/review-${review}"
            rm -rf "$tmp" "$dest"
            mkdir -p "$tmp" "$dest"

            if ! git -C framework-source cat-file -e "${sha}^{commit}"; then
              printf '%s\t%s\t%s\t%s\t%s\tcommit introuvable\n' "$slot" "$review" "$date" "$sha" "$status" >> .review-build/rejected.tsv
              continue
            fi

            git -C framework-source archive "$sha" dev/framework | tar -x -C "$tmp"
            src="$tmp/dev/framework"
            required=(demo/index.html demo/demo.js demo/demo.css ui/base.css wiz/data-wiz.js wiz/qr-wiz.js wiz/json-studio.js components/theme-workshop.js)
            ok=1
            for file in "${required[@]}"; do
              [[ -f "$src/$file" ]] || { echo "MISSING: $file"; ok=0; }
            done

            if [[ "$ok" -eq 1 ]]; then
              cp -a "$src/." "$dest/"
              cp "$src/demo/index.html" "$dest/index.html"

              python3 - "$dest" "$review" "$slot" "$date" "$sha" "$status" <<'PY'
          import re, sys
          from pathlib import Path
          dest=Path(sys.argv[1]); review,slot,date,sha,status=sys.argv[2:]
          entry=dest/'index.html'
          html=entry.read_text(encoding='utf-8')
          html=html.replace('<head>','<head>\n  <base href="./demo/">\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">',1)
          badge=f'<div style="position:fixed;right:8px;bottom:8px;z-index:99999;font:11px/1.2 monospace;padding:5px 7px;border:1px solid currentColor;border-radius:6px;background:Canvas;color:CanvasText;opacity:.86">Version {slot} · Review V{review} · {date} · {sha[:8]} · {status}</div>'
          html=html.replace('<body>','<body>\n'+badge,1)
          entry.write_text(html,encoding='utf-8')

          missing=[]
          pattern=re.compile(r"(?:import\s+(?:[^'\"]*?\s+from\s+)?|export\s+[^'\"]*?\s+from\s+)[\"']([^\"']+)[\"']|import\s*\(\s*[\"']([^\"']+)[\"']\s*\)")
          for js in dest.rglob('*.js'):
              text=js.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  spec=match.group(1) or match.group(2)
                  if not spec.startswith('.'): continue
                  target=(js.parent/spec).resolve()
                  candidates=[target]
                  if target.suffix=='': candidates.append(Path(str(target)+'.js'))
                  if not any(p.exists() for p in candidates): missing.append(f'{js.relative_to(dest)} -> {spec}')
          if missing:
              print('BROKEN IMPORTS:'); print('\n'.join(missing)); raise SystemExit(7)
          PY

              if ! find "$dest" -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null; then
                echo "JavaScript syntax check failed for V${review}"
                ok=0
              fi
            fi

            if [[ "$ok" -eq 1 ]]; then
              printf '%s\t%s\t%s\t%s\t%s\n' "$slot" "$review" "$date" "$sha" "$status" >> .review-build/validated.tsv
            else
              rm -rf "$dest"
              printf '%s\t%s\t%s\t%s\t%s\tvalidation échouée\n' "$slot" "$review" "$date" "$sha" "$status" >> .review-build/rejected.tsv
            fi
          done < .review-build/reviews.tsv

          python3 build_preview.py .review-build/validated.tsv reviews.json _site/legacy-web-framework.html _site/VALIDATED_REVIEWS.json

          echo '--- VALIDATED LEGACY REVIEWS ---'
          cat .review-build/validated.tsv || true
          echo '--- REJECTED LEGACY REVIEWS ---'
          cat .review-build/rejected.tsv || true
          test -s .review-build/validated.tsv
          grep -q 'Ouvrir la review' _site/legacy-web-framework.html
          grep -q 'data-toggle-review' _site/legacy-web-framework.html
          test -f _site/VALIDATED_REVIEWS.json
          test -f _site/assets/preview-browser.js
          test -f _site/assets/preview-ui-fixes.js
          test -f _site/assets/preview-resilience.js
          test -f _site/assets/preview-v13.js
          test -f _site/assets/preview-v14.js
          test -f _site/assets/preview-v15.js
          test -f _site/assets/preview-v16.js
          test -f _site/assets/preview-v17.js
          test -f _site/assets/preview-v171-hotfix.js
          test -f _site/assets/preview-v19.js
          test -f _site/assets/preview-sandbox-center.js
          test -f _site/assets/config/sandbox-features.json
          test -f _site/assets/project-logos/default-project.svg
          test -f _site/assets/project-logos/temporary-project.svg
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_site/Preview-Web-Sandbox/nlab-wordmark-text/project.json').read_text(encoding='utf-8'))
          if data.get('preview_status',{}).get('state') != 'validated':
              raise SystemExit('nLab mini-logo validation state missing')
          PY
          grep -q 'nlab-mini-logo-text' _site/assets/config/sandbox-features.json
          test -f _site/LIGHTHOUSE-BENCHMARK-PROCESS.md
          grep -q 'lighthouse-benchmark' _site/assets/config/sandbox-features.json
          test -f _site/assets/runtime/public-inventory.js
          test -f _site/assets/runtime/public-inventory.json
          test -s _site/assets/runtime/images/recettes-du-coeur.png
          grep -q "const VERSION='V1.8'" _site/assets/preview-v171-hotfix.js
          grep -q "const VERSION='V1.9'" _site/assets/preview-v19.js
          grep -q "const VERSION='V2.4'" _site/assets/preview-sandbox-center.js
          test -f _site/assets/config/priority-registry.json
          test -f _site/assets/config/private-data-auth.json
          test -f _site/Preview-Web-Sandbox/README.md
          test -f _site/Preview-Web-Sandbox/nlab-webmaster-preview/production-current/index.html
          test -f _site/Preview-Web-Sandbox/nlab-webmaster-preview/20260813_150000_V2.5-layout-themes/index.html
          test -f _site/Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/index.html
          test -f _site/Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/project-hierarchy.json
          grep -q 'project-hierarchy-v0.2' _site/Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/index.html
          grep -q 'network_requests_on_load' _site/Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/project-hierarchy.json
          grep -q "const VERSION='V2.5'" _site/assets/preview-v25.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed V2.5 in Chrome
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            echo "Public Chrome smoke attempt ${attempt}/4"
            if timeout 25s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --enable-logging=stderr --log-level=0 --virtual-time-budget=6000 --dump-dom "${PREVIEW_URL}?ci=${GITHUB_SHA}" > .review-build/public-dom.html 2> .review-build/chrome.log; then
              if grep -q 'nLab Webmaster Preview · V2.5' .review-build/public-dom.html \
                && grep -q 'class="project-card"' .review-build/public-dom.html \
                && grep -q 'lighthouse-version-link' .review-build/public-dom.html \
                && grep -q 'lighthouse-production-link' .review-build/public-dom.html \
                && grep -q 'temporary-project.svg' .review-build/public-dom.html \
                && grep -q 'id="projectFilters"' .review-build/public-dom.html \
                && grep -q 'v25-layout-controls' .review-build/public-dom.html \
                && grep -q 'id="v14GithubCenter"' .review-build/public-dom.html \
                && grep -q 'nLab Webmaster Review' .review-build/public-dom.html \
                && ! grep -Eq 'Uncaught (TypeError|ReferenceError|SyntaxError)' .review-build/chrome.log; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "${ok}" != 1 ]]; then
            tail -80 .review-build/chrome.log || true
            grep -E 'statusText|project-card|lighthouse-version-link|V2\.5' .review-build/public-dom.html | head -40 || true
            exit 1
          fi
          gantt_url="${PREVIEW_URL}Preview-Web-Sandbox/nlab-gantt-dashboard/20260813_160000_V0.2-hierarchical/?project=web-framework&ci=${GITHUB_SHA}"
          timeout 25s google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom "${gantt_url}" > .review-build/gantt-dom.html 2> .review-build/gantt-chrome.log
          grep -q '<section id="detail">' .review-build/gantt-dom.html
          grep -q 'Projet · nLab Web Framework' .review-build/gantt-dom.html
          grep -q 'aria-level="4"' .review-build/gantt-dom.html
          grep -q 'aria-label="Replier Dashboard System"' .review-build/gantt-dom.html
          grep -q 'Master Preview' .review-build/gantt-dom.html
          ! grep -Eq 'Uncaught (TypeError|ReferenceError|SyntaxError)' .review-build/gantt-chrome.log

          python3 - <<'PY'
          from pathlib import Path
          html=Path('.review-build/public-dom.html').read_text(encoding='utf-8')
          print({
              'status': 'PASS',
              'project_cards': html.count('class="project-card"'),
              'lighthouse_version_links': html.count('lighthouse-version-link'),
              'lighthouse_production_links': html.count('lighthouse-production-link'),
              'project_filter_chips': html.count('project-filter-chip'),
              'version': 'V2.5',
          })
          PY
