name: Deploy Preview Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview repository
        uses: actions/checkout@v4

      - name: Checkout Framework V2
        uses: actions/checkout@v4
        with:
          repository: nepheris/NLab-framework
          ref: New
          path: framework-source

      - name: Build public Framework V2 preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a framework-source/dev/framework/. _site/
          cp framework-source/dev/framework/demo/index.html _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('<head>', '<head>\n  <base href="./demo/">', 1)
          path.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll
          git -C framework-source rev-parse HEAD > _site/FRAMEWORK_SOURCE_SHA.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
