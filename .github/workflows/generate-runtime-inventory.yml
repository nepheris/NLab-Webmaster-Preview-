name: Generate Preview Runtime Inventory

on:
  push:
    branches: [main]
    paths:
      - 'Preview-Web-Sandbox/**'
      - 'scripts/generate_public_inventory.py'
      - '.github/workflows/generate-runtime-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-runtime-inventory
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate runtime snapshot
        run: |
          set -euo pipefail
          python3 scripts/generate_public_inventory.py Preview-Web-Sandbox assets/runtime/public-inventory.js
          node --check assets/runtime/public-inventory.js
          python3 -m json.tool assets/runtime/public-inventory.json >/dev/null

      - name: Commit runtime snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- assets/runtime/public-inventory.js assets/runtime/public-inventory.json)" ]]; then
            echo 'Runtime inventory already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime/public-inventory.js assets/runtime/public-inventory.json
          git commit -m 'chore(preview): refresh generated public runtime inventory'
          git push
