name: Generate Preview Runtime Inventory

on:
  push:
    branches: [main]
    paths:
      - 'Preview-Web-Sandbox/**'
      - 'scripts/generate_public_inventory.py'
      - '.github/workflows/generate-runtime-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: preview-runtime-inventory
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate runtime snapshot
        run: |
          set -euo pipefail
          python3 scripts/generate_public_inventory.py Preview-Web-Sandbox assets/runtime/public-inventory.js
          node --check assets/runtime/public-inventory.js
          python3 -m json.tool assets/runtime/public-inventory.json >/dev/null

      - name: Mirror public project assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets/runtime/images
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            /repos/recettesducoeur/recettesducoeur.github.io/contents/assets/images/logos/favicon.png \
            > assets/runtime/images/recettes-du-coeur.png
          test -s assets/runtime/images/recettes-du-coeur.png

      - name: Commit runtime snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            assets/runtime/public-inventory.js
            assets/runtime/public-inventory.json
            assets/runtime/images/recettes-du-coeur.png
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'Runtime inventory already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${paths[@]}"
            git commit -m 'chore(preview): refresh generated public runtime inventory'
            git push
          fi

      - name: Dispatch Pages from refreshed main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
